version: 3

env:
  BORDER: double
  BORDER_FOREGROUND: "212"
  PADDING: "1 1"
  MARGIN: "1 1"
  NAMESPACE: db

tasks:
  01-create-namespace:
    desc: "Create a namespace for these examples and set as default"
    cmds:
      - kubectl apply -f Namespace.yaml
      - kubens ${NAMESPACE}

  02-install-cnpg-operator:
    desc: "Install cloudnative-pg operator"
    cmds:
      - "helm repo add cnpg https://cloudnative-pg.github.io/charts"
      - |
        helm upgrade --install cnpg \
          --namespace cnpg-system \
          --create-namespace \
          cnpg/cloudnative-pg

  03-apply-minimal-cluster:
    desc: "Apply minimal cnpg cluster definition"
    cmds:
      - kubectl apply -f Cluster.cnpg-minimal.yaml

  04-create-google-cloud-storage-bucket:
    desc: "Create a google cloud storage bucket for backups"
    vars:
      BUCKET_NAME: kubernetes-klaus-cnpg-backups
    cmds:
      - gcloud storage buckets create gs://{{.BUCKET_NAME}}

  05-create-iam-service-account:
    desc: "Create GCP IAM service account and attach necessary permissions"
    vars:
      BUCKET_NAME: kubernetes-klaus-cnpg-backups
      Project_ID: k8s-learning-gke

    cmds:
      - |
        gcloud iam service-accounts create cnpg-backups \
          --display-name "Cloud Native PG Service Account"
      - cmd: gum style "Attach roles/storage.objectAdmin and roles/storage.legacyBucketReader to IAM service account for backup bucket"
        silent: true
      - |
        gcloud storage buckets add-iam-policy-binding gs://{{.BUCKET_NAME}} \
          --member="serviceAccount:cnpg-backups@k8s-learning-gke.iam.gserviceaccount.com" \
          --role="roles/storage.objectAdmin"
        gcloud storage buckets add-iam-policy-binding gs://{{.BUCKET_NAME}} \
          --member="serviceAccount:cnpg-backups@k8s-learning-gke.iam.gserviceaccount.com" \
          --role="roles/storage.legacyBucketReader"

      - cmd: gum style "Attach roles/iam.workloadIdentityUser to kubernetes service account"
        silent: true
      - |
        gcloud iam service-accounts add-iam-policy-binding cnpg-backups@k8s-learning-gke.iam.gserviceaccount.com \
          --role roles/iam.workloadIdentityUser \
          --member "serviceAccount:k8s-learning-gke.svc.id.goog[cnpg/cnpg-with-backup-config]"

  06-apply-cluster-with-backup-config-gcp:
    desc: "Apply cnpg cluster definition with backup configuration"
    cmds:
      - cmd: gum style "🚨 This assumes you have set up a Google Cloud Storage bucket with workload identity providing access to the pod! 🚨 "
        silent: true
      - kubectl apply -f Cluster.cnpg-with-backup-config-gcp.yaml
      - kubectl apply -f ScheduleBackup.yaml
      - kubectl apply -f Backup.yaml

  07-create-azure-storage-account:
    desc: "Create an Azure storage account and container for backups"
    vars:
      STORAGE_ACCOUNT: kuberneteskcnpgbackups
      CONTAINER_NAME: cnpg-backups
      RESOURCE_GROUP: k8s-learning-rg
    cmds:
      - |
        az storage account create \
          --name {{.STORAGE_ACCOUNT}} \
          --resource-group {{.RESOURCE_GROUP}} \
          --sku Standard_LRS
      - |
        az storage container create \
          --name {{.CONTAINER_NAME}} \
          --account-name {{.STORAGE_ACCOUNT}} \
          --auth-mode login

  08-create-iam-service-account-azure:
    desc: "Create Azure managed identity and attach necessary permissions"
    vars:
      STORAGE_ACCOUNT: kuberneteskcnpgbackups
      RESOURCE_GROUP: k8s-learning-rg
    cmds:
      - |
        az identity create \
          --name cnpg-backups \
          --resource-group {{.RESOURCE_GROUP}}
      - cmd: gum style "Attach Storage Blob Data Contributor role to the managed identity for the backup storage account"
        silent: true
      - |
        az role assignment create \
          --role "Storage Blob Data Contributor" \
          --assignee "$(az identity show --name cnpg-backups --resource-group {{.RESOURCE_GROUP}} --query principalId -o tsv)" \
          --scope "$(az storage account show --name {{.STORAGE_ACCOUNT}} --resource-group {{.RESOURCE_GROUP}} --query id -o tsv)"
      - cmd: gum style "Create federated credential to allow kubernetes service account to use the managed identity via workload identity"
        silent: true
      - |
        az identity federated-credential create \
          --name cnpg-backups \
          --identity-name cnpg-backups \
          --resource-group {{.RESOURCE_GROUP}} \
          --issuer "$(az aks show --name k8s-learning-aks --resource-group {{.RESOURCE_GROUP}} --query oidcIssuerProfile.issuerUrl -o tsv)" \
          --subject "system:serviceaccount:${NAMESPACE}:cnpg-with-backup-config-azure" \
          --audience api://AzureADTokenExchange

  09-apply-cluster-with-backup-config-azure:
    desc: "Apply cnpg cluster definition with backup configuration"
    cmds:
      - cmd: gum style "🚨 This assumes you have set up an Azure Storage container with workload identity providing access to the pod! 🚨 "
        silent: true
      - kubectl apply -f Cluster.cnpg-with-backup-config-azure.yaml
      - kubectl apply -f ScheduleBackup.yaml
      - kubectl apply -f Backup.yaml

  10-delete-namespace:
    desc: "Delete the namespace to clean up"
    cmds:
      - cmd: gum style "🚨 Deleting the namespace recursively deletes the resources inside of it! 🚨 "
        silent: true
      - kubectl delete -f Namespace.yaml
