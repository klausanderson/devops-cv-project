apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloud-specific-manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: eso-config
                  basePath: 04-eso-and-cnpg-and-tilt/external-secrets-operator/manifests
                  namespace: external-secrets
                  syncWave: "2"
                - app: kps-config
                  basePath: 04-eso-and-cnpg-and-tilt/kube-prometheus-stack/manifests
                  namespace: monitoring
                  syncWave: "4"
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: '{{.app}}-{{.nameNormalized}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.syncWave}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/klausanderson/devops-cv-project
        targetRevision: main
        path: '{{.basePath}}/{{.metadata.labels.cloud}}'
      destination:
        name: '{{.name}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
